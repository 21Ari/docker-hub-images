name: Build and Deploy Python API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-api
          push: true
          tags: arijitacn/python-api:latest

      - name: Pull Latest Image
        run: docker pull arijitacn/python-api:latest

      - name: Remove Existing Container
        shell: powershell
        run: |
          if (docker ps -a --format "{{.Names}}" | Select-String "python-api-container") {
            docker rm -f python-api-container
          }

      - name: Run New Container
        shell: powershell
        run: |
          docker run -d `
          --name python-api-container `
          -p 5000:5000 `
          arijitacn/python-api:latest
